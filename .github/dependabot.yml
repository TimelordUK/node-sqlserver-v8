# Dependabot configuration.
#
# Alerts + automated security fixes are already enabled on the repo, but with no
# config file Dependabot only ever opened security PRs for npm and never touched
# the workflow actions themselves. This adds weekly version updates (grouped so
# we get one PR of dev-tooling bumps rather than twenty) and keeps the GitHub
# Actions we call pinned to current majors.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Routine tooling churn: one PR a week for the lot.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      # node-addon-api / node-gyp-build ship in the published package, so keep
      # them in their own PR - it is the one CI must be green on.
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      # Everything Dependabot can fix from an advisory lands in a single PR.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # Majors stay ungrouped so electron/typescript jumps arrive as their own PR.
    ignore:
      # TypeScript 7 is the native rewrite, and typescript-eslint refuses to
      # load against it: it hard-throws "typescript-eslint does not support
      # TS 7.0" on any major >= 7, so `npm run lint` dies before linting a
      # single file. Its peer range is >=4.8.4 <6.1.0.
      #
      # We were on ^7.0.2 for weeks with lint silently broken as a result, so
      # this stays ignored rather than being re-offered every Monday. Lift it
      # when typescript-eslint ships TS >=7 support - tracked upstream at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
