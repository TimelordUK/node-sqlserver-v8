name: Test Driver

on:
  push:
    branches: [n_api, master]
  pull_request:
    branches: [n_api, master]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test Linux - Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest

    steps:
    - name: Create directory structure
      run: mkdir -p node_modules

    - uses: actions/checkout@v4
      with:
        path: node_modules/msnodesqlv8

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install Linux dependencies
      timeout-minutes: 20
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
        curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        # Hosted runners point apt at an azure.archive.ubuntu.com mirror that is
        # frequently unreachable. apt then falls back to archive.ubuntu.com, which
        # can trickle bytes indefinitely - with no timeout the step never fails, it
        # just runs until the 6 hour job limit kills the whole job.
        APT_OPTS="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3"
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get update $APT_OPTS && break
          echo "apt-get update stalled or failed (attempt $attempt/3), retrying"
          sleep 15
        done
        # No gcc-10/g++-10 here on purpose: they pull ~48 MB out of noble universe
        # via the same flaky mirror, and the default toolchain handles the -std=c++20
        # binding.gyp asks for. binding.gyp only pins gcc-10 when it finds it on PATH,
        # so leaving it out is all that is needed. prebuild.yml keeps the pin for ABI
        # compatibility of the published binaries.
        sudo timeout 900 env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y $APT_OPTS msodbcsql18 mssql-tools18 unixodbc-dev

    - name: Run SQL Server
      uses: potatoqualitee/mssqlsuite@v1.7
      with:
        install: sqlengine, sqlclient
        version: 2022
        sa-password: YourStrong!Passw0rd
        show-log: true

    - name: Create test databases
      timeout-minutes: 5
      run: |
        # potatoqualitee/mssqlsuite reports success after a fixed 10s sleep plus a
        # `docker ps` check. On a slow first boot that lands while SQL Server is
        # still running its upgrade steps, and the sa login is rejected. Poll for a
        # login that actually works rather than trusting the action's timing.
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        SA_PWD='YourStrong!Passw0rd'
        for attempt in $(seq 1 60); do
          if $SQLCMD -S localhost -U sa -P "$SA_PWD" -C -l 5 -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server ready after ${attempt} attempt(s)"
            break
          fi
          if [ "$attempt" -eq 60 ]; then
            echo "SQL Server did not accept a login within 2 minutes"
            docker logs sql 2>&1 | tail -50 || true
            exit 1
          fi
          sleep 2
        done
        $SQLCMD -S localhost -U sa -P "$SA_PWD" -C -Q "CREATE DATABASE [node];"
        $SQLCMD -S localhost -U sa -P "$SA_PWD" -C -Q "CREATE DATABASE [scratch];"

    - name: Install dependencies
      working-directory: node_modules/msnodesqlv8
      run: npm install

    - name: Build TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build

    - name: Build test TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build:test

    - name: Run tests
      working-directory: node_modules/msnodesqlv8
      env:
        DEFAULT: "Driver={ODBC Driver 18 for SQL Server}; Server=localhost; Uid=SA; Pwd=YourStrong!Passw0rd; TrustServerCertificate=yes;"
      run: npm test
      timeout-minutes: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-node${{ matrix.node }}
        path: |
          node_modules/msnodesqlv8/test-results/
          node_modules/msnodesqlv8/mochawesome-report/

  test-windows:
    name: Test Windows - Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: windows-2022

    steps:
    - name: Create directory structure
      run: mkdir node_modules

    - uses: actions/checkout@v4
      with:
        path: node_modules/msnodesqlv8

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install SQL Server
      uses: potatoqualitee/mssqlsuite@v1.7
      with:
        install: sqlengine, sqlclient
        version: 2019
        sa-password: Password12
        show-log: true

    - name: Create test databases
      shell: powershell
      timeout-minutes: 5
      run: |
        # Same race as the Linux job: a fixed sleep is a guess at how long the
        # instance takes to finish first-boot recovery. Poll for a working login.
        $ErrorActionPreference = "Continue"
        $ready = $false
        foreach ($attempt in 1..60) {
          $null = & sqlcmd -S localhost -U sa -P Password12 -l 5 -Q "SELECT 1" 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SQL Server ready after $attempt attempt(s)"
            $ready = $true
            break
          }
          Start-Sleep -Seconds 2
        }
        if (-not $ready) {
          Write-Host "SQL Server did not accept a login within 2 minutes"
          exit 1
        }

        sqlcmd -S localhost -U sa -P Password12 -Q "CREATE DATABASE [node];"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        sqlcmd -S localhost -U sa -P Password12 -Q "CREATE DATABASE [scratch];"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Install dependencies
      working-directory: node_modules/msnodesqlv8
      run: npm install

    - name: Build TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build

    - name: Build test TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build:test

    - name: Run tests
      working-directory: node_modules/msnodesqlv8
      env:
        DEFAULT: "Driver={ODBC Driver 17 for SQL Server}; Server=localhost; Uid=sa; Pwd=Password12;"
      run: npm test
      timeout-minutes: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows-node${{ matrix.node }}
        path: |
          node_modules/msnodesqlv8/test-results/
          node_modules/msnodesqlv8/mochawesome-report/

  test-macos:
    name: Test macOS - Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: macos-latest

    steps:
    - name: Create directory structure
      run: mkdir -p node_modules

    - uses: actions/checkout@v4
      with:
        path: node_modules/msnodesqlv8

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install macOS dependencies
      run: |
        # Homebrew now requires explicit trust for third-party taps; the
        # Microsoft mssql-release tap is trusted here so msodbcsql18 installs.
        export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
        brew install unixodbc
        brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release
        brew update
        HOMEBREW_ACCEPT_EULA=Y brew install msodbcsql18 mssql-tools18

    - name: Install dependencies
      working-directory: node_modules/msnodesqlv8
      run: npm install

    - name: Build TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build

    - name: Build test TypeScript
      working-directory: node_modules/msnodesqlv8
      run: npm run build:test

    - name: Test module loading (without SQL Server)
      working-directory: node_modules/msnodesqlv8
      run: |
        echo "Testing basic module loading on macOS..."
        echo "Checking directory structure..."
        ls -la
        ls -la lib/ || echo "lib directory not found"
        node -e "
        try {
          const sql = require('./lib/index.js');
          console.log('✅ Module loaded successfully on macOS');
          console.log('Module exports:', Object.keys(sql));
        } catch (err) {
          console.error('❌ Module load failed:', err.message);
          console.error('Trying alternative path...');
          try {
            const sql2 = require('./');
            console.log('✅ Module loaded via package.json main');
            console.log('Module exports:', Object.keys(sql2));
          } catch (err2) {
            console.error('❌ Alternative load failed:', err2.message);
            process.exit(1);
          }
        }
        "

    - name: Verify macOS build success
      working-directory: node_modules/msnodesqlv8
      run: |
        echo "✅ macOS build verification completed successfully"
        echo "   • Module compiles on Apple Silicon"
        echo "   • Native addon loads without errors"
        echo "   • All SQL Server exports are available"
        echo ""
        echo "Note: Full SQL Server testing is done on Linux and Windows platforms"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos-node${{ matrix.node }}
        path: |
          node_modules/msnodesqlv8/test-results/
          node_modules/msnodesqlv8/mochawesome-report/
