name: Prebuild Binaries

# Allow manual triggering
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload prebuilds to (leave empty to use package.json version)'
        required: false
        type: string
        default: ''
      create_release:
        description: "Create new release if it doesn't exist"
        required: false
        type: boolean
        default: true

#  push:
 #   branches: [n_api, master]
#  tags:
#      - 'v*'
#  pull_request:
#    branches: [n_api, master]

jobs:
  # These builds are N-API, not ABI-tagged. cpp/ is pure node-addon-api (no
  # v8:: anywhere), so one binary per platform/arch/libc serves every Node line
  # AND every Electron version -- which is why there is no longer a node axis
  # here and no separate Electron job at all. The build matrix is now exactly
  # the set of platforms we ship, nothing more.
  #
  # The Node version below only builds the artifact; it does not appear in the
  # artifact name and does not constrain who can consume it. Any Node whose
  # N-API level is >= binary.napi_versions in package.json will do.
  prebuild-napi:
    name: Prebuild N-API on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # Linux specific setup
    - name: Install Linux dependencies
      timeout-minutes: 20
      if: runner.os == 'Linux'
      run: |
        # The GitHub-hosted Ubuntu runner image ships a pre-configured
        # /etc/apt/sources.list.d/microsoft-prod.list with
        # Signed-By=/usr/share/keyrings/microsoft-prod.gpg. If we add our
        # own list pointing at the same source URL without a matching
        # Signed-By, apt errors out with:
        #   "Conflicting values set for option Signed-By regarding source
        #    https://packages.microsoft.com/ubuntu/22.04/prod/ jammy"
        # Remove the pre-installed file before writing our own.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

        # Add Microsoft repository
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
        curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list

        # Install dependencies
        # Hosted runners point apt at an azure.archive.ubuntu.com mirror that is
        # frequently unreachable. apt then falls back to archive.ubuntu.com, which
        # can trickle bytes indefinitely - with no timeout the step never fails, it
        # just runs until the 6 hour job limit kills the whole job.
        APT_OPTS="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3"
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get update $APT_OPTS && break
          echo "apt-get update stalled or failed (attempt $attempt/3), retrying"
          sleep 15
        done
        sudo timeout 900 env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y $APT_OPTS msodbcsql18 mssql-tools18 unixodbc-dev gcc-10 g++-10

        # Set compiler
        echo "CC=gcc-10" >> $GITHUB_ENV
        echo "CXX=g++-10" >> $GITHUB_ENV

    # Windows specific setup
    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # ODBC Driver 18 for SQL Server should already be installed on Windows runners
        # Just verify it exists
        Get-OdbcDriver -Name "*SQL Server*"

    # macOS specific setup
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        # Homebrew now requires explicit trust for third-party taps; the
        # Microsoft mssql-release tap is trusted here so msodbcsql18 installs.
        export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
        brew install unixodbc
        # Download and install ODBC Driver
        brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release
        brew update
        HOMEBREW_ACCEPT_EULA=Y brew install msodbcsql18 mssql-tools18

    - name: Install npm dependencies
      run: npm install

    # prebuildify writes prebuilds/<platform>-<arch>/<name>[.tags].node, which
    # is the layout node-gyp-build resolves at require time. There is no ABI
    # axis under --napi, so this produces exactly one file per job.
    #
    # --tag-libc is Linux-only and matters more than it looks. node-gyp-build
    # only filters on the libc tag when the tag is present, so an UNTAGGED
    # glibc binary would happily be selected on Alpine and then fail to link.
    # Both Linux jobs must tag, or the musl job's output is pointless.
    # prebuildify defaults opts.libc to 'glibc' on every non-Alpine host,
    # including Windows and macOS, so those jobs deliberately do not tag.
    - name: Prebuild binaries
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          npx prebuildify --napi --strip --tag-libc
        else
          npx prebuildify --napi --strip
        fi

    # Prove the artifact we are about to ship actually loads on this platform.
    # PREBUILDS_ONLY=1 stops node-gyp-build falling back to the build/Release
    # tree that prebuildify just left behind, so this tests the real binary.
    - name: Smoke test the prebuild
      shell: bash
      run: PREBUILDS_ONLY=1 node .github/scripts/smoke-prebuild.js

    # One `shell: bash` listing serves every OS now that the Windows runner
    # does not need its own PowerShell variant. Note BSD find on macOS has no
    # -printf, so sizes come from ls rather than find.
    - name: List generated prebuilds
      shell: bash
      run: |
        echo "=== Generated prebuilds ==="
        find prebuilds -type f -name "*.node" -exec ls -l {} +

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: prebuilds-napi-${{ matrix.os }}
        path: prebuilds/

  # Alpine (musl) prebuilds run inside a node:<N>-alpine container on an
  # ubuntu runner because GitHub Actions doesn't offer native alpine runners.
  # Build steps mirror docker/alpine-msnodesqlv8/Dockerfile: apk-install the
  # toolchain + unixodbc-dev, then drop in the Microsoft msodbcsql18 .apk for
  # the ODBC headers (the driver itself is loaded dynamically at runtime).
  # prebuildify auto-detects musl libc; with --tag-libc the output lands at
  # prebuilds/linux-x64/msnodesqlv8.musl.node, i.e. the SAME directory as the
  # glibc job, disambiguated only by the tag. That is why both Linux jobs tag.
  prebuild-napi-alpine:
    name: Prebuild N-API on Alpine Linux (musl)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    # download.microsoft.com is fronted by Akamai edges that sometimes serve an
    # incomplete TLS chain; the musl/alpine CA bundle then can't verify it
    # (curl error 60). Fetch the .apk on the host runner, which has a full CA
    # store, and install the local file inside the container.
    - name: Download msodbcsql18 apk (host)
      run: |
        curl -sSLO https://download.microsoft.com/download/1/f/f/1fffb537-26ab-4947-a46a-7a45c27f6f77/msodbcsql18_18.2.1.1-1_amd64.apk

    - name: Build in node:22-alpine
      run: |
        docker run --rm \
          -v "$PWD":/src \
          -w /src \
          node:22-alpine sh -c '
            set -ex
            apk add --no-cache ca-certificates python3 make g++ unixodbc-dev
            update-ca-certificates || true
            apk add --allow-untrusted msodbcsql18_18.2.1.1-1_amd64.apk
            rm -f msodbcsql18_18.2.1.1-1_amd64.apk

            npm install

            npx prebuildify --napi --strip --tag-libc

            # Same smoke test as the other jobs: prove the musl binary loads
            # inside the musl container before it is ever published.
            PREBUILDS_ONLY=1 node .github/scripts/smoke-prebuild.js

            # Make prebuildify output readable by the host runner (container writes as root).
            chmod -R a+rwX prebuilds
          '

    - name: List generated prebuilds
      run: |
        echo "=== Generated prebuilds ==="
        find prebuilds -type f -name "*.node" -exec ls -l {} +

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: prebuilds-napi-alpine
        path: prebuilds/

  # Everything the matrix produced is merged back into a single prebuilds/
  # tree here, which is exactly the layout that ships inside the npm tarball.
  # The old job in this slot counted files and pushed tar.gz assets to a
  # GitHub release; consumers no longer fetch those at install time, so the
  # deliverable is now the packed .tgz itself.
  pack:
    name: Assemble and pack
    needs: [prebuild-napi, prebuild-napi-alpine]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    # merge-multiple flattens every artifact into one prebuilds/ tree. Each
    # job uploaded the CONTENTS of its prebuilds/ dir, so the platform-arch
    # directories land side by side and the two Linux jobs merge into the
    # single linux-x64 directory, distinguished by their libc tags.
    - name: Download all prebuilds
      uses: actions/download-artifact@v8
      with:
        pattern: prebuilds-napi-*
        merge-multiple: true
        path: prebuilds/

    - name: Verify the expected set is present
      run: |
        echo "=== Assembled prebuilds ==="
        find prebuilds -type f -name "*.node" -exec ls -l {} +

        # Fail loudly on a partial matrix rather than publishing a package
        # that silently drops a platform.
        missing=0
        while read -r f; do
          if [ ! -f "$f" ]; then
            echo "MISSING: $f"
            missing=1
          fi
        done <<FILES
        prebuilds/win32-x64/msnodesqlv8.node
        prebuilds/darwin-arm64/msnodesqlv8.node
        prebuilds/linux-x64/msnodesqlv8.glibc.node
        prebuilds/linux-x64/msnodesqlv8.musl.node
        FILES
        [ "$missing" = "0" ] || exit 1
        echo "All four platform binaries present."

    # --ignore-scripts because the install script is node-gyp-build, and there
    # is no reason to build native code just to pack an already-built tree.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Pack
      id: pack
      run: |
        TARBALL=$(npm pack --silent)
        echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
        echo "=== $TARBALL ==="
        ls -l "$TARBALL"

    # Prove the packed artifact works with no install script and no build
    # toolchain step -- the situation of an Artifactory mirror, a locked-down
    # host, or anyone running `npm ci --ignore-scripts` as policy.
    #
    # --ignore-scripts is the load-bearing flag: it stops node-gyp-build
    # running, so nothing can compile and nothing can fetch a binary. A pass
    # here can only come from the bundled prebuild. Note this is deliberately
    # NOT `--offline`: the package's own deps (node-addon-api, node-gyp-build)
    # still resolve from the registry or its mirror, as they always have. What
    # this change removes is the separate binary download from GitHub
    # releases, not the registry itself.
    - name: Verify the packed tarball installs and loads without scripts
      run: |
        TARBALL="${{ steps.pack.outputs.tarball }}"
        mkdir -p /tmp/verify && cd /tmp/verify
        npm init -y >/dev/null
        npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
        echo "=== bundled binaries in the installed package ==="
        find node_modules/msnodesqlv8/prebuilds -type f -name "*.node" -exec ls -l {} +
        node -e "
          const sql = require('msnodesqlv8')
          console.log('offline install loaded ok, exports:', Object.keys(sql).length)
          if (Object.keys(sql).length === 0) process.exit(1)
        "

    - name: Upload packed tarball
      uses: actions/upload-artifact@v7
      with:
        name: npm-tarball
        path: ${{ steps.pack.outputs.tarball }}

    - name: Summary
      run: |
        echo "### Packed \`${{ steps.pack.outputs.tarball }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Bundled N-API binaries (no install-time download):" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Windows (win32-x64)" >> $GITHUB_STEP_SUMMARY
        echo "- Linux glibc 2.35+ (linux-x64, built on Ubuntu 22.04)" >> $GITHUB_STEP_SUMMARY
        echo "- Linux musl (linux-x64 .musl, built in node:22-alpine)" >> $GITHUB_STEP_SUMMARY
        echo "- macOS Apple Silicon (darwin-arm64)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "N-API v$(node -p "require('./package.json').binary.napi_versions.join(', v')"). One binary per platform serves every Node line and every Electron version." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Publish with: \`npm publish ${{ steps.pack.outputs.tarball }}\`" >> $GITHUB_STEP_SUMMARY
